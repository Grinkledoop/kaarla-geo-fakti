<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Par projektu | Ģeo Portāls</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    :root { --gold: #c8a96e; --bg: #0b0c10; --card: #111418; --text: #e8e6df; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: 'DM Sans', sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column;
    }

    /* Navigācija */
    nav { background: var(--card); padding: 1.2rem; text-align: center; border-bottom: 1px solid #232931; }
    nav a { text-decoration: none; font-weight: bold; margin: 0 15px; color: #8892b0; transition: 0.3s; }
    nav a:hover { color: #fff; }
    .nav-active { color: var(--gold) !important; border-bottom: 2px solid var(--gold); padding-bottom: 5px; }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-family: 'Playfair Display', serif; font-size: 3rem; color: #f0ebe0; }

    /* Galvenais lodziņš */
    .about-card { 
      background: var(--card); 
      border: 1px solid #232931; 
      padding: 3rem; 
      border-radius: 24px; 
      max-width: 600px; 
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .about-card p {
      font-size: 1.15rem;
      line-height: 1.8;
      color: #b1b8c0;
    }

    .about-card strong {
      color: var(--gold);
    }

    .footer { padding: 2rem; text-align: center; font-size: 0.9rem; color: #64748b; }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Sākums</a>
  <a href="quiz.html">Ģeo Tests</a>
  <a href="fakti.html">Ģeo Fakti</a>
  <a href="about.html" class="nav-active">Par projektu</a>
</nav>

<main class="main-content">
  <header>
    <h1>Par projektu</h1>
  </header>

  <div class="about-card">
    <p>
      <strong>Kārļa Ģeo Fakti</strong> ir mans programmēšanas projekts kurā es veidoju saiti ar dažādu informāciju par dažādām valstīm. 
      <br><br>
      Šeit var gan mācīties par valstīm gan darīt testus par tām.
    </p>
  </div>
</main>

<div class="footer">
  &copy; 2026 Kārļa K. Bremzes Ģeo Fakti.
</div>

</body>
</html>
