<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ģeo Tests Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root { --gold: #c8a96e; --bg: #0b0c10; --card: #111418; --text: #e8e6df; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; margin: 0; }
    
    nav { background: var(--card); padding: 1.2rem; text-align: center; border-bottom: 1px solid #232931; }
    nav a { text-decoration: none; font-weight: bold; margin: 0 15px; color: #8892b0; transition: 0.3s; }
    .nav-active { color: var(--gold) !important; border-bottom: 2px solid var(--gold); padding-bottom: 5px; }
    nav a:hover { color: #fff; }

    .container { max-width: 650px; margin: 2rem auto; padding: 0 1rem; text-align: center; }
    header h1 { font-family: 'Playfair Display', serif; font-size: 2.8rem; margin-bottom: 0.5rem; }
    
    .quiz-card { background: var(--card); border: 1px solid #232931; padding: 2.5rem; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); position: relative; overflow: hidden; min-height: 500px; display: flex; flex-direction: column; justify-content: center; }
    
    .progress-bar { position: absolute; top: 0; left: 0; height: 6px; background: var(--gold); transition: width 0.4s ease; width: 0%; }

    #start-screen { display: none; }
    
    .search-container { position: relative; margin: 20px 0; width: 100%; }
    #country-search { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #30363d; background: #1c2128; color: #fff; font-size: 1rem; outline: none; }
    #country-search:focus { border-color: var(--gold); }
    
    .search-results { position: absolute; top: 100%; left: 0; right: 0; background: #1c2128; border: 1px solid #30363d; border-radius: 0 0 12px 12px; z-index: 10; max-height: 200px; overflow-y: auto; text-align: left; }
    .search-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #232931; transition: 0.2s; }
    .search-item:hover { background: #232931; color: var(--gold); }

    .target-preview { margin: 15px 0; font-size: 1.8rem; color: var(--gold); font-family: 'Playfair Display', serif; }

    #quiz-content { display: none; }
    .question-text { font-size: 1.4rem; color: #fff; margin-bottom: 2rem; line-height: 1.4; }
    
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .option-btn { padding: 1.1rem; background: #1c2128; border: 1px solid #30363d; border-radius: 12px; color: #fff; cursor: pointer; text-align: left; font-size: 1.05rem; transition: 0.2s; min-height: 60px; width: 100%; }
    .option-btn:hover:not(:disabled) { border-color: var(--gold); background: #232931; }
    
    .flag-grid { grid-template-columns: 1fr 1fr; }
    .flag-btn { height: 120px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .flag-btn img { max-height: 80%; max-width: 90%; border-radius: 4px; pointer-events: none; }

    .correct { background: #1b4332 !important; border-color: #4ade80 !important; }
    .wrong { background: #4a1b1b !important; border-color: #f87171 !important; }

    #result-screen { display: none; }
    .final-score { font-size: 4rem; color: var(--gold); margin: 1rem 0; font-family: 'Playfair Display', serif; }

    .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 1.5rem; flex-wrap: wrap; }
    .main-btn { padding: 1rem 2rem; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; font-family: 'DM Sans', sans-serif; font-size: 1rem; }
    .primary { background: var(--gold); color: #0b0c10; }
    .secondary { background: #1c2128; color: #fff; border: 1px solid #30363d; }
    .main-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .main-btn:hover:not(:disabled) { transform: translateY(-2px); opacity: 0.9; }

    .loader { border: 4px solid #1c2128; border-top: 4px solid var(--gold); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Sākums</a>
  <a href="fakti.html">Ģeo Fakti</a>
  <a href="quiz.html" class="nav-active">Ģeo Tests</a>
  <a href="about.html">Par projektu</a>
</nav>

<div class="container">
  <header>
    <h1>Pasaules Tests</h1>
  </header>

  <div class="quiz-card">
    <div id="progress" class="progress-bar"></div>

    <div id="loader-box">
      <div class="loader"></div>
      <p id="loader-msg">Ielādējam valstu datus no visas pasaules...</p>
    </div>

    <div id="start-screen">
      <p>Meklē un izvēlies valsti:</p>
      
      <div class="search-container">
        <input type="text" id="country-search" placeholder="Piemēram: Latvija, Francija, Brazīlija..." autocomplete="off">
        <div id="search-results" class="search-results"></div>
      </div>

      <p style="font-size: 0.9rem; color: #8892b0;">Izvēlētā valsts:</p>
      <div class="target-preview" id="start-country-name">---</div>
      
      <div class="btn-group">
        <button id="start-btn" class="main-btn primary" onclick="startQuiz()" disabled>Sākt testu</button>
        <button class="main-btn secondary" onclick="shuffleCountry()">Nejauša valsts</button>
      </div>
    </div>

    <div id="quiz-content">
      <div style="color: var(--gold); font-size: 0.8rem; margin-bottom: 10px; letter-spacing: 2px;">
        JAUTĀJUMS <span id="q-idx">1</span>/10
      </div>
      <p id="q-text" class="question-text"></p>
      <div id="options" class="options-grid"></div>
    </div>

    <div id="result-screen">
      <h2>Tests pabeigts!</h2>
      <div class="final-score" id="res-score">0/10</div>
      <p id="res-msg"></p>
      <div class="btn-group">
        <button class="main-btn primary" onclick="startQuiz()">Atkārtot šo valsti</button>
        <button class="main-btn secondary" onclick="resetToStart()">Cita valsts</button>
      </div>
    </div>
  </div>
</div>

<script>
let allCountries = [];
let target = null;
let questions = [];
let qIndex = 0;
let score = 0;

// Rezerves saraksts gadījumam, ja API nedarbojas
const backupCountries = [
  { name:{common:"Latvia"}, translations:{lav:{common:"Latvija"}}, capital:["Rīga"], region:"Europe", population:1900000, flags:{png:"https://flagcdn.com/w320/lv.png"}, unMember:true, currencies:{EUR:{name:"Eiro"}}, languages:{lav:"Latviešu"}, car:{side:"right"}, subregion:"Ziemeļeiropa", idd:{root:"+3",suffixes:["71"]} },
  { name:{common:"France"}, translations:{lav:{common:"Francija"}}, capital:["Parīze"], region:"Europe", population:67000000, flags:{png:"https://flagcdn.com/w320/fr.png"}, unMember:true, currencies:{EUR:{name:"Eiro"}}, languages:{fra:"Franču"}, car:{side:"right"}, subregion:"Rietumeiropa", idd:{root:"+3",suffixes:["3"]} },
  { name:{common:"Japan"}, translations:{lav:{common:"Japāna"}}, capital:["Tokija"], region:"Asia", population:125000000, flags:{png:"https://flagcdn.com/w320/jp.png"}, unMember:true, currencies:{JPY:{name:"Jēna"}}, languages:{jpn:"Japāņu"}, car:{side:"left"}, subregion:"Austrumāzija", idd:{root:"+8",suffixes:["1"]} },
  { name:{common:"Brazil"}, translations:{lav:{common:"Brazīlija"}}, capital:["Brazīlija"], region:"Americas", population:214000000, flags:{png:"https://flagcdn.com/w320/br.png"}, unMember:true, currencies:{BRL:{name:"Reāls"}}, languages:{por:"Portugāļu"}, car:{side:"right"}, subregion:"Dienvidamerika", idd:{root:"+5",suffixes:["5"]} },
  { name:{common:"Egypt"}, translations:{lav:{common:"Ēģipte"}}, capital:["Kaira"], region:"Africa", population:100000000, flags:{png:"https://flagcdn.com/w320/eg.png"}, unMember:true, currencies:{EGP:{name:"Mārciņa"}}, languages:{ara:"Arābu"}, car:{side:"right"}, subregion:"Ziemeļāfrika", idd:{root:"+2",suffixes:["0"]} }
];

const searchInput = document.getElementById('country-search');
const searchResults = document.getElementById('search-results');
const startBtn = document.getElementById('start-btn');
const startCountryName = document.getElementById('start-country-name');

async function init() {
  try {
    const res = await fetch('https://restcountries.com/v3.1/all?fields=name,capital,region,languages,currencies,translations,population,unMember,idd,car,borders,flags,subregion');
    if (!res.ok) throw new Error();
    allCountries = await res.json();
    show('start-screen');
  } catch(e) {
    allCountries = backupCountries;
    show('start-screen');
  }
}

// Meklēšanas loģika
searchInput.addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase();
  searchResults.innerHTML = '';
  if (query.length < 1) return;

  const matches = allCountries.filter(c => {
    const lv = (c.translations?.lav?.common || "").toLowerCase();
    const en = c.name.common.toLowerCase();
    return lv.includes(query) || en.includes(query);
  }).slice(0, 6);

  matches.forEach(c => {
    const div = document.createElement('div');
    div.className = 'search-item';
    div.textContent = c.translations?.lav?.common || c.name.common;
    div.onclick = () => selectCountry(c);
    searchResults.appendChild(div);
  });
});

function selectCountry(c) {
  target = c;
  startCountryName.textContent = c.translations?.lav?.common || c.name.common;
  startBtn.disabled = false;
  searchResults.innerHTML = '';
  searchInput.value = '';
}

function shuffleCountry() {
  const valid = allCountries.filter(c => c.capital?.length > 0);
  selectCountry(valid[Math.floor(Math.random() * valid.length)]);
}

function resetToStart() {
  target = null;
  startCountryName.textContent = '---';
  startBtn.disabled = true;
  show('start-screen');
}

function startQuiz() {
  score = 0; qIndex = 0;
  const name = target.translations?.lav?.common || target.name.common;
  const cur  = target.currencies ? Object.values(target.currencies)[0].name : 'Eiro';
  const lang = target.languages ? Object.values(target.languages)[0] : 'Vietējā';
  const popRaw = target.population;
  
  questions = [
    { type:'flag', q:`Kurš ir ${name} valsts karogs?`, answer: target.flags.png },
    { type:'cap',  q:`Kura ir ${name} galvaspilsēta?`, answer: target.capital[0] },
    { type:'reg',  q:`Kurā pasaules daļā atrodas ${name}?`, answer: translateRegion(target.region) },
    { type:'cur',  q:`Kāda ir oficiālā valūta valstī ${name}?`, answer: cur },
    { type:'lang', q:`Kura ir viena no valodām valstī ${name}?`, answer: lang },
    { type:'pop',  q:`Aptuvenais iedzīvotāju skaits valstī ${name}?`, answer: popRaw.toLocaleString('lv-LV'), rawPop: popRaw },
    { type:'idd',  q:`Kāds ir ${name} tālsarunu kods?`, answer: (target.idd?.root || '') + (target.idd?.suffixes?.[0] || '+00') },
    { type:'side', q:`Kurā pusē ${name} pārvietojas transports?`, answer: target.car?.side === 'right' ? 'Labajā pusē' : 'Kreisajā pusē' },
    { type:'sub',  q:`Kurā subreģionā atrodas ${name}?`, answer: target.subregion || translateRegion(target.region) },
    { type:'un',   q:`Vai ${name} ir Apvienoto Nāciju Organizācijas (ANO) dalībvalsts?`, answer: target.unMember ? 'Jā' : 'Nē' }
  ];

  show('quiz-content');
  showQuestion();
}

function showQuestion() {
  const q = questions[qIndex];
  document.getElementById('q-idx').textContent = qIndex + 1;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('progress').style.width = (qIndex * 10) + '%';

  const optDiv = document.getElementById('options');
  optDiv.innerHTML = '';
  optDiv.className = q.type === 'flag' ? 'options-grid flag-grid' : 'options-grid';

  const choices = generateChoices(q);

  choices.forEach(val => {
    const btn = document.createElement('button');
    btn.className = q.type === 'flag' ? 'option-btn flag-btn' : 'option-btn';
    if (q.type === 'flag') {
      btn.innerHTML = `<img src="${val}">`;
    } else {
      btn.textContent = val;
    }
    btn.onclick = () => {
      document.querySelectorAll('.option-btn').forEach(b => {
        b.disabled = true;
        const bVal = q.type === 'flag' ? b.querySelector('img').src : b.textContent;
        if (bVal === q.answer) b.classList.add('correct');
      });
      if ((q.type === 'flag' ? val : val) === q.answer) score++;
      else btn.classList.add('wrong');
      
      setTimeout(() => {
        qIndex++;
        if (qIndex < questions.length) showQuestion();
        else showFinal();
      }, 1200);
    };
    optDiv.appendChild(btn);
  });
}

function generateChoices(q) {
  // Speciālie gadījumi, kur nav vajadzīgi 4 varianti vai tie ir fiksēti
  if (q.type === 'un') return ['Jā', 'Nē'];
  if (q.type === 'side') return ['Labajā pusē', 'Kreisajā pusē'];

  let set = new Set();
  set.add(q.answer);

  // Reģioniem fiksēts saraksts, lai vienmēr būtu 4
  if (q.type === 'reg') {
    return shuffle(['Eiropa', 'Āzija', 'Amerika', 'Āfrika', 'Okeānija']).slice(0, 4);
  }

  let attempts = 0;
  while (set.size < 4 && attempts < 500) {
    attempts++;
    const randomCountry = allCountries[Math.floor(Math.random() * allCountries.length)];
    let val = "";

    switch(q.type) {
      case 'flag': val = randomCountry.flags.png; break;
      case 'cap':  val = randomCountry.capital?.[0]; break;
      case 'cur':  val = randomCountry.currencies ? Object.values(randomCountry.currencies)[0].name : null; break;
      case 'lang': val = randomCountry.languages ? Object.values(randomCountry.languages)[0] : null; break;
      case 'pop':  
        const fakePop = Math.floor(q.rawPop * (0.3 + Math.random() * 2));
        val = fakePop.toLocaleString('lv-LV');
        break;
      case 'idd':  val = (randomCountry.idd?.root || '') + (randomCountry.idd?.suffixes?.[0] || ''); break;
      case 'sub':  val = randomCountry.subregion; break;
    }

    if (val && val !== "undefined" && val !== "") set.add(val);
  }

  // Ja joprojām trūkst (ļoti retos gadījumos), pievienojam fillerus
  while (set.size < 4) {
    set.add("Nezināms " + set.size);
  }

  return shuffle([...set]);
}

function showFinal() {
  show('result-screen');
  document.getElementById('res-score').textContent = `${score}/10`;
  document.getElementById('res-msg').textContent = score >= 8 ? 'Izcili! Tu esi ģeogrāfijas meistars!' : score >= 5 ? 'Labs rezultāts!' : 'Ir vēl kur augt!';
  document.getElementById('progress').style.width = '100%';
}

function show(id) {
  ['loader-box','start-screen','quiz-content','result-screen'].forEach(div => {
    document.getElementById(div).style.display = div === id ? 'block' : 'none';
  });
}

function translateRegion(r) {
  const dict = { Europe:'Eiropa', Asia:'Āzija', Americas:'Amerika', Africa:'Āfrika', Oceania:'Okeānija', Antarctic:'Antarktika' };
  return dict[r] || r;
}

function shuffle(a) {
  return a.sort(() => Math.random() - 0.5);
}

document.addEventListener('click', (e) => {
  if (e.target !== searchInput) searchResults.innerHTML = '';
});

init();
</script>
</body>
</html>
